[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thematicml"
version = "0.1.0"
description = "Local-first machine learning platform for qualitative thematic analysis (classical ML, graphs, temporal statistics; no LLMs)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "pydantic>=2.0",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "python-docx>=1.0",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Lexicon-based sentiment (VADER). Rule-based, not a neural model.
sentiment = ["vaderSentiment>=3.3"]
# Seasonal decomposition and ARIMA.
temporal = ["statsmodels>=0.14"]
# Leiden community detection.
leiden = ["python-igraph>=0.11", "leidenalg>=0.10"]
# PDF report export.
reports = ["fpdf2>=2.7"]
# Local web application backend.
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
# Optional graph neural networks (neural; not part of the classical pipeline).
gnn = ["torch>=2.2", "torch-geometric>=2.5"]
dev = ["pytest>=8"]
# optional browser smoke check (tools/ui_smoke.py); uses the installed Edge or Chrome
ui-test = ["playwright>=1.40"]
all = [
    "thematicml[sentiment,temporal,leiden,reports,api,dev]",
]

[tool.setuptools.packages.find]
where = ["src", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "backend"]
